<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Centurion map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%}
  #map{width:100%;height:100%;background:#eef2f5;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  .leaflet-container{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', { zoomControl: false, attributionControl: true, scrollWheelZoom: false })
    .setView([-25.8603, 28.1894], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
  L.circle([-25.8603, 28.1894], {
    radius: 7000, color: '#0A5FC2', weight: 2.5, fillColor: '#0A5FC2', fillOpacity: 0.18
  }).addTo(map);
  L.marker([-25.8603, 28.1894]).addTo(map).bindTooltip('Centurion', { permanent: true, direction: 'top' });
</script>
</body>
</html>
